name: Unit Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
      - 'codex/**'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run verification test suite and reporting integrity checks
        run: |
          python -c "from scripts.reporting_data import verify_canonical_evidence_hashes; print(verify_canonical_evidence_hashes())"
          python -m pytest -q
          python run_explainable_doe_demo.py --smoke --output output/ci-sequential-smoke
          python run_explainable_doe_demo.py --check output/ci-sequential-smoke
          python scripts/audit_scientific_consistency.py
          python scripts/generate_report_artifacts.py --check
          python scripts/generate_research_reporting.py --check
          git diff --exit-code results/ config.yaml
          git diff --exit-code 2420992bda129063c8da38d50e65d1881ccbb20e -- config.yaml results/revision_v2/full_run_001/
          git diff --exit-code v1.0.0 -- results/anova_ccd_latency.csv results/benchmark.csv results/benchmark_evals_trajectories.csv results/benchmark_optimizer_incumbents.csv results/benchmark_summary.json results/confirmation.json results/confirmation_runs.csv results/confirmation_runs_single_obj.csv results/depth_opt_table.csv results/desirability_sensitivity.csv results/diagnostics.json results/env.json results/icc.json results/latency_modeling.json results/latency_models_comparison.csv results/lof.json results/phase1.json results/phase3.json results/ridge_table.csv results/runs.csv
