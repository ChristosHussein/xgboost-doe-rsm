schema_version: "2.0"
campaign_id: "sentiment_hpo_v1"
protocol_version: "2026-10-28"
status: "PRE-EXPERIMENT REGISTERED CONTRACT"

study_questions:
  Q1: "Do ANOVA 2nd-order interaction terms and surrogate SHAP interaction values agree on factor importance and pairwise synergy?"
  Q2: "Can quadratic response surfaces and Gaussian Processes accurately predict performance at untested boundary coordinates?"
  Q3: "Does sequential adaptive augmentation improve surrogate prediction accuracy and Pareto efficiency compared to static CCD?"
  Q4: "What multi-objective trade-off (accuracy, latency, feasibility, regret) do DOE and TPE achieve under equal fit budgets?"
  Q5: "Can local quadratic response surfaces explain document-level word interactions with high fidelity?"

datasets:
  imdb:
    source_url: "https://huggingface.co/datasets/stanfordnlp/imdb/resolve/e6281661ce1c48d982bc483cf8a173c1bbeb5d31/plain_text"
    total_rows: 50000
    development_rows: 25000
    test_rows: 25000
    nuisance_blocks: 5
    preprocessing: "TF-IDF (10000 unigrams/bigrams, sublinear tf)"
    holdout_gate: "Strictly isolated official test split"

factors:
  x1: { name: "learning_rate", coded: [-1.0, 0.0, 1.0], natural: [0.05, 0.175, 0.30], scale: "linear" }
  x2: { name: "max_depth", coded: [-1.0, 0.0, 1.0], natural: [3, 6, 9], scale: "integer" }
  x3: { name: "subsample", coded: [-1.0, 0.0, 1.0], natural: [0.50, 0.75, 1.00], scale: "linear" }
  x4: { name: "reg_lambda", coded: [-1.0, 0.0, 1.0], natural: [0.10, 1.00, 10.00], scale: "log10" }

methods:
  static_doe:
    name: "Static Face-Centered CCD"
    fits_per_replicate: 140
    design: "16 factorial + 8 axial + 4 center replicates per block"
  doe:
    name: "Sequential / Adaptive Face-Centered CCD"
    fits_per_replicate: 140
    design: "16 factorial + 8 axial + 2 center replicates, then 2 adaptive infill cycles"
  tpe:
    name: "Multi-Objective TPE"
    fits_per_replicate: 140
    design: "28 configurations proposed sequentially, evaluated on 5 blocks"

replicates: 3
confirmation_coordinates: 12
warmup_inferences: 100
timed_inferences: 500
training_threads: 4
inference_threads: 1
cpu_affinity: "pinned core 0"
